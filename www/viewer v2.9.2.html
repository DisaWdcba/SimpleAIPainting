<!doctype html>
<html lang="zh-CN" class="">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>米醋画图</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          brand: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' }
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="viewer.css">
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-700 dark:text-slate-300">

<!-- ===== HEADER ===== -->
<header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-slate-200/70 dark:border-slate-700/70">
  <div class="max-w-full mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="icon.ico" class="w-8 h-8 rounded-xl" alt="米醋画图" />
      <h1 class="font-semibold text-slate-800 dark:text-slate-200 text-lg tracking-tight">米醋画图</h1>
    </div>
    <div class="flex items-center gap-3">
      <div class="flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-slate-200 dark:border-slate-700">
        <button class="tab-btn px-4 py-1.5 rounded-lg text-sm text-slate-500 dark:text-slate-400" data-tab="decode">解码</button>
        <button class="tab-btn active px-4 py-1.5 rounded-lg text-sm text-slate-500 dark:text-slate-400" data-tab="generate">生成</button>
      </div>
      <div class="w-px h-6 bg-slate-200 dark:bg-slate-700 hidden lg:block"></div>
      <button id="mobile-sidebar-toggle" class="lg:hidden w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors" title="接口配置">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
      </button>
      <button id="theme-toggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors" title="切换明暗模式">
        <svg id="theme-icon-sun" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <svg id="theme-icon-moon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>
      <button id="history-toggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors" title="生图历史">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ===== MAIN ===== -->
<main class="max-w-full mx-auto">

  <!-- Tab: Base64 Decode -->
  <section class="panel" id="tab-decode">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-8">
      <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm ring-1 ring-slate-900/5 dark:ring-slate-700/50 p-6 sm:p-8">
        <label class="block text-sm font-semibold text-slate-800 dark:text-slate-200 mb-3">粘贴 Base64 编码 或 Data URL</label>
        <textarea id="b64-input"
          class="w-full min-h-[180px] rounded-2xl border-2 border-dashed border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 p-4 font-mono text-[13px] text-slate-700 dark:text-slate-300 outline-none focus:border-brand-500 dark:focus:border-brand-400 resize-y"
          placeholder="data:image/png;base64,iVBORw0KGgo..."></textarea>

        <div class="mt-4 flex flex-wrap gap-3 items-center">
          <button id="b64-decode" class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 dark:bg-brand-500 dark:hover:bg-brand-600 text-white text-sm font-medium transition-colors">解析并预览</button>
          <button id="b64-clear" class="px-5 py-2.5 rounded-xl bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-600 transition-colors">清空内容</button>
          <span id="b64-status" class="text-sm"></span>
        </div>

        <div id="b64-preview" class="hidden mt-8 border-t border-slate-100 dark:border-slate-700 pt-6">
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-slate-50 dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 p-2 flex items-center justify-center min-h-[220px]">
              <img id="b64-img" class="max-w-full h-auto rounded-xl checkerboard max-h-[520px]" alt="" />
            </div>
            <div class="space-y-4">
              <div class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl p-4">
                <div class="text-[11px] text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-3 font-bold">图像元数据</div>
                <div id="b64-meta" class="space-y-2"></div>
              </div>
              <a id="b64-download" download="image.png" class="block text-center px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-600 transition-colors">下载图片</a>
              <button id="b64-open" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-600 transition-colors">新标签页打开</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Tab: API Generate -->
  <section class="panel active" id="tab-generate">
    <div class="flex h-[calc(100vh-3.5rem)] max-sm:min-h-[calc(100vh-3.5rem)] max-sm:h-auto">

      <!-- Mobile sidebar backdrop -->
      <div id="sidebar-backdrop" class="sidebar-backdrop lg:hidden"></div>

      <!-- Left Sidebar: API Config (collapsible) -->
      <aside id="config-sidebar" class="sidebar bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 p-5 flex flex-col">
        <div class="sidebar-header flex items-center justify-between mb-4">
          <h2 class="font-semibold text-slate-800 dark:text-slate-200 text-sm">接口配置</h2>
          <button id="sidebar-toggle" class="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" title="收起配置">
            <svg id="sidebar-toggle-icon" class="w-4 h-4 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg>
          </button>
        </div>

        <div class="sidebar-hideable flex flex-col gap-4 flex-1 overflow-y-auto pr-1">
          <div class="flex flex-wrap gap-2">
            <select id="api-profile" class="flex-1 min-w-0 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-lg px-2.5 py-1.5 text-slate-700 dark:text-slate-300"></select>
            <button id="api-new" class="text-xs font-medium text-slate-600 dark:text-slate-400 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">新建</button>
          </div>
          <div class="flex flex-wrap gap-2">
            <button id="api-detect" class="text-xs font-medium text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/40 border border-indigo-200 dark:border-indigo-800 px-3 py-1.5 rounded-lg hover:bg-indigo-100 dark:hover:bg-indigo-900/60 transition-colors">连通检测</button>
            <button id="cfg-save" class="text-xs font-medium text-brand-600 dark:text-brand-400 bg-brand-50 dark:bg-brand-900/40 border border-brand-200 dark:border-brand-800 px-3 py-1.5 rounded-lg hover:bg-brand-100 dark:hover:bg-brand-900/60 transition-colors">保存</button>
            <button id="api-delete" class="text-xs font-medium text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-900/40 border border-rose-200 dark:border-rose-800 px-3 py-1.5 rounded-lg hover:bg-rose-100 dark:hover:bg-rose-900/60 transition-colors">删除</button>
          </div>

          <div class="space-y-3 flex-1">
            <div>
              <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Base URL</label>
              <input id="cfg-baseurl" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm outline-none focus:border-brand-500 dark:focus:border-brand-400 text-slate-700 dark:text-slate-300" placeholder="https://你的中转域名/v1" />
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">API Key</label>
              <input id="cfg-key" type="password" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 font-mono text-sm outline-none focus:border-brand-500 dark:focus:border-brand-400 text-slate-700 dark:text-slate-300" placeholder="sk-..." />
            </div>
            <div class="flex items-end gap-2">
              <div class="flex-1">
                <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Model</label>
                <input id="cfg-model" list="model-datalist" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 font-mono text-sm outline-none focus:border-brand-500 dark:focus:border-brand-400 text-slate-700 dark:text-slate-300" placeholder="gpt-image-2" />
                <datalist id="model-datalist"></datalist>
              </div>
              <button id="api-fetch-models" class="text-xs font-medium text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/40 border border-emerald-200 dark:border-emerald-800 px-3 py-2 rounded-lg hover:bg-emerald-100 dark:hover:bg-emerald-900/60 transition-colors shrink-0" title="从接口获取可用模型列表">获取模型</button>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Reasoning Effort</label>
              <select id="cfg-reasoning" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm outline-none focus:border-brand-500 dark:focus:border-brand-400 text-slate-700 dark:text-slate-300">
                <option value="">不指定 (默认)</option>
                <option value="xhigh">XHigh</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
                <option value="minimal">Minimal</option>
                <option value="none">None</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Endpoint 模式</label>
              <select id="cfg-mode" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm outline-none focus:border-brand-500 dark:focus:border-brand-400 text-slate-700 dark:text-slate-300">
                <option value="images">/v1/images/generations</option>
                <option value="edits">/v1/images/edits</option>
                <option value="chat">/v1/chat/completions</option>
              </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Size</label>
                <input id="cfg-size" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 font-mono text-sm outline-none focus:border-brand-500 dark:focus:border-brand-400 text-slate-700 dark:text-slate-300" placeholder="1024x1024" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">N</label>
                <input id="cfg-n" type="number" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 font-mono text-sm outline-none focus:border-brand-500 dark:focus:border-brand-400 text-slate-700 dark:text-slate-300" placeholder="1" />
              </div>
            </div>

            <!-- Prompt helper -->
            <div class="border-t border-slate-100 dark:border-slate-700 pt-4 space-y-4">
              <div>
                <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Prompt 模板</label>
                <div class="flex gap-2">
                  <select id="prompt-template" class="flex-1 min-w-0 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm text-slate-700 dark:text-slate-300">
                    <option value="">不使用模板</option>
                    <option value="photo">写实摄影</option>
                    <option value="poster">电影海报</option>
                    <option value="product">电商产品图</option>
                    <option value="anime">二次元插画</option>
                    <option value="portrait">头像 / 人像</option>
                    <option value="lineart">线稿 / 上色</option>
                  </select>
                  <button id="apply-prompt-template" class="text-xs font-medium text-brand-600 dark:text-brand-400 bg-brand-50 dark:bg-brand-900/40 border border-brand-200 dark:border-brand-800 px-3 py-2 rounded-lg hover:bg-brand-100 dark:hover:bg-brand-900/60 transition-colors shrink-0">应用</button>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Quality</label>
                  <select id="cfg-quality" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm outline-none focus:border-brand-500 dark:focus:border-brand-400 text-slate-700 dark:text-slate-300">
                    <option value="">默认</option>
                    <option value="standard">Standard</option>
                    <option value="high">High</option>
                  </select>
                </div>
                <div>
                  <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Style</label>
                  <select id="cfg-style" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm outline-none focus:border-brand-500 dark:focus:border-brand-400 text-slate-700 dark:text-slate-300">
                    <option value="">默认</option>
                    <option value="vivid">Vivid</option>
                    <option value="natural">Natural</option>
                  </select>
                </div>
              </div>

              <div>
                <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">尺寸预设</label>
                <select id="cfg-aspect" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm outline-none focus:border-brand-500 dark:focus:border-brand-400 text-slate-700 dark:text-slate-300">
                  <option value="">自定义尺寸</option>
                  <option value="1:1">1:1 → 1024x1024</option>
                  <option value="4:3">4:3 → 1536x1024</option>
                  <option value="3:4">3:4 → 1024x1536</option>
                  <option value="16:9">16:9 → 1792x1024</option>
                  <option value="9:16">9:16 → 1024x1792</option>
                </select>
              </div>

              <div>
                <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Negative Prompt</label>
                <textarea id="cfg-negative" rows="3" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm outline-none focus:border-brand-500 dark:focus:border-brand-400 text-slate-700 dark:text-slate-300 resize-y" placeholder="例如：低清晰度、模糊、畸形手、额外肢体..."></textarea>
              </div>
            </div>
          </div>

          <div id="cfg-status" class="text-center text-xs"></div>

          <!-- Edits card -->
          <div id="edits-card" class="hidden border-t border-slate-100 dark:border-slate-700 pt-4">
            <div class="flex items-center justify-between mb-2">
              <h2 class="font-semibold text-slate-800 dark:text-slate-200 text-sm">参考图像</h2>
              <span class="text-[10px] px-2 py-0.5 rounded bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 font-bold">支持多图</span>
            </div>
            <p class="text-[11px] text-slate-400 dark:text-slate-500 mb-3">拖入、点击或 Ctrl+V 粘贴图片（最多 9 张）</p>
            <div id="img-drop" class="rounded-2xl border-2 border-dashed border-slate-200 dark:border-slate-600 bg-slate-50/70 dark:bg-slate-900/70 overflow-hidden cursor-pointer">
              <div id="img-empty" class="py-8 px-4 text-center">
                <div class="text-3xl mb-2">🖼️</div>
                <div class="text-sm font-medium text-slate-500 dark:text-slate-400">点击 · 拖入 · 粘贴</div>
                <div class="text-[11px] text-slate-400 dark:text-slate-500 mt-1">PNG / JPG / WebP，最多 9 张</div>
              </div>
              <div id="img-active-area" class="hidden p-2 bg-slate-100/70 dark:bg-slate-900/70 flex justify-center">
                <div class="relative inline-block">
                  <img id="input-img" class="max-w-full max-h-[240px] rounded-lg shadow-sm select-none block" alt="preview" draggable="false" />
                </div>
              </div>
              <input type="file" id="img-file" accept="image/*" multiple class="hidden" />
            </div>
            <div id="img-gallery" class="hidden grid grid-cols-2 gap-2 mt-3"></div>
            <div class="flex items-center gap-2 mt-3" id="img-actions">
              <button id="img-remove" class="text-[11px] px-2 py-1 rounded border border-slate-200 dark:border-slate-600 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">清空全部</button>
            </div>
          </div>
        </div><!-- /sidebar-hideable -->
      </aside>

      <!-- Workbench -->
      <div class="flex-1 flex flex-col min-w-0">
        <div class="flex-1 flex flex-col overflow-hidden">
          <div class="px-4 py-2.5 border-b border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex items-center justify-between shrink-0">
            <div class="font-semibold text-slate-700 dark:text-slate-200 text-sm">工作台</div>
            <div class="flex items-center gap-2">
              <button id="gen-clear" class="text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-600 transition-colors">清空记录</button>
              <button id="debug-toggle" class="text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-600 transition-colors flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
                调试
              </button>
            </div>
          </div>

          <div id="chat" class="flex-1 overflow-y-auto p-4 sm:p-6 flex flex-col gap-4"></div>

          <!-- Prompt input -->
          <div class="p-3 sm:p-4 border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 shrink-0">
            <div class="max-w-4xl mx-auto bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-2xl p-1.5 focus-within:border-brand-500 dark:focus-within:border-brand-400 focus-within:ring-4 focus-within:ring-brand-500/10 dark:focus-within:ring-brand-400/10 focus-within:bg-white dark:focus-within:bg-slate-800 transition-all">
              <textarea id="gen-prompt" rows="2"
                class="w-full bg-transparent border-none px-3 py-2 text-sm text-slate-800 dark:text-slate-200 outline-none resize-none leading-relaxed"
                placeholder="描述你要生成的画面内容..."></textarea>
              <div class="flex items-center justify-between px-2 pb-1 gap-2">
                <span class="text-[10px] text-slate-400 dark:text-slate-500 hidden sm:inline">Shift + Enter 换行</span>
                <div class="flex items-center gap-2 ml-auto">
                  <button id="gen-send"
                    class="w-10 h-8 flex items-center justify-center bg-brand-600 hover:bg-brand-700 dark:bg-brand-500 dark:hover:bg-brand-600 text-white rounded-lg transition-all active:scale-95 shadow-md shadow-brand-500/30"
                    title="发送">
                    <svg id="gen-send-icon" class="w-4 h-4 ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                    </svg>
                    <svg id="gen-stop-icon" class="w-4 h-4 hidden" fill="currentColor" viewBox="0 0 24 24">
                      <rect x="4" y="4" width="16" height="16" rx="2"/>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
            <div class="mt-2 text-center">
              <span id="gen-status" class="text-xs font-medium empty:hidden"></span>
            </div>
          </div>

          <!-- Debug panel -->
          <div id="debug-panel" class="hidden border-t border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 shrink-0" style="max-height:360px;">
            <div class="flex items-center justify-between px-4 py-2 border-b border-slate-200 dark:border-slate-700">
              <span class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide">调试信息 · 连通检测 &amp; API 原始响应</span>
              <button id="debug-clear" class="text-[11px] px-2 py-0.5 rounded border border-slate-200 dark:border-slate-600 text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition-colors">清空</button>
            </div>
            <div id="debug-content" class="p-4 overflow-y-auto" style="max-height:320px; font-family:'JetBrains Mono','SF Mono','Cascadia Code','Fira Code','Consolas','Menlo',monospace;">
              <pre class="text-[13px] leading-relaxed text-slate-600 dark:text-slate-300 whitespace-pre-wrap break-all">等待操作…</pre>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- ===== HISTORY DRAWER ===== -->
<div id="history-overlay" class="drawer-overlay"></div>
<div id="history-drawer" class="drawer-panel bg-white dark:bg-slate-800 flex flex-col">
  <div class="px-5 py-4 border-b border-slate-200 dark:border-slate-700 shrink-0 space-y-3">
    <div class="flex items-center justify-between gap-3">
      <h2 class="font-semibold text-slate-800 dark:text-slate-200">生图历史</h2>
      <div class="flex items-center gap-2">
        <button id="history-clear-all" class="text-[11px] px-2.5 py-1 rounded-lg bg-rose-50 dark:bg-rose-900/40 text-rose-500 dark:text-rose-400 hover:bg-rose-100 dark:hover:bg-rose-900/60 transition-colors">清空全部</button>
        <button id="history-close" class="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <div class="space-y-2">
      <input id="history-search" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm outline-none focus:border-brand-500 dark:focus:border-brand-400 text-slate-700 dark:text-slate-300" placeholder="搜索 Prompt / 模型 / 错误信息" />
      <div class="grid grid-cols-2 gap-2">
        <select id="history-mode-filter" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm text-slate-700 dark:text-slate-300">
          <option value="">全部模式</option>
          <option value="images">Images</option>
          <option value="edits">Edits</option>
          <option value="chat">Chat</option>
        </select>
        <select id="history-status-filter" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 px-3 py-2 text-sm text-slate-700 dark:text-slate-300">
          <option value="">全部状态</option>
          <option value="done">成功</option>
          <option value="error">失败</option>
        </select>
      </div>
      <div class="flex items-center justify-between text-[11px] text-slate-400 dark:text-slate-500">
        <span>支持按关键字筛选</span>
        <span id="history-count">0 条</span>
      </div>
    </div>
  </div>
  <div id="history-list" class="flex-1 overflow-y-auto p-4 space-y-3">
    <div class="text-center text-sm text-slate-400 dark:text-slate-500 py-8">暂无历史记录</div>
  </div>
</div>

<!-- ===== HISTORY DETAIL MODAL ===== -->
<div id="detail-overlay" class="fixed inset-0 bg-black/40 dark:bg-black/60 z-50 opacity-0 pointer-events-none transition-opacity duration-300"></div>
<div id="detail-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
  <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
    <div class="flex items-center justify-between px-5 py-3 border-b border-slate-200 dark:border-slate-700 shrink-0">
      <h3 class="font-semibold text-slate-800 dark:text-slate-200 text-sm">历史详情</h3>
      <button id="detail-close" class="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="detail-body" class="flex-1 overflow-y-auto p-5 space-y-4"></div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast" class="toast hidden bg-slate-800 dark:bg-slate-100 text-white dark:text-slate-800"></div>

<script src="js/bridge.js"></script>
<script src="js/storageAdapter.js"></script>
<script src="viewer.js"></script>
</body>
</html>
